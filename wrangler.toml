name = "kakobuysheetqc"
main = "worker.js"
compatibility_date = "2026-09-16"

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "none"
html_handling = "auto-trailing-slash"
# Serve these through worker.js (Assets returns 500 for our XML files)
run_worker_first = ["/sitemap.xml", "/sitemap-index.xml", "/sitemap-pages.xml", "/sitemaps/*", "/img/products/*"]
