name: Bump fresh month

on:
  schedule:
    # 1st of every month at 00:10 UTC → Oct 1 bumps "Sep 2026" → "Oct 2026"
    - cron: "10 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump Latest update month
        run: python3 scripts/bump_fresh_month.py

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: bump Latest update to current month"
          file_pattern: index.html js/data.js
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
